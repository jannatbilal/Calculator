
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        main {
            background-color: #222;
            padding: 20px;
            border-radius: 15px;
            width: 320px;
        }

        h2 {
            color: white;
            text-align: center;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            height: 60px;
            margin-bottom: 15px;
            font-size: 26px;
            text-align: right;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-spacing: 5px;
        }

        button {
            width: 100%;
            height: 55px;
            font-size: 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            background-color: #444;
            color: white;
        }

        button:hover {
            background-color: #666;
        }

        .operator {
            background-color: #e69527;
        }

        .clear {
            background-color: #d94343;
        }

        .equal {
            background-color: #238636;
        }
    </style>
</head>

<body>

    <main>
        <h2>Calculator</h2>

        <input type="text" id="display" value="0" readonly>

        <table>
            <tr>
                <td><button class="clear" onclick="clearDisplay()">C</button></td>
                <td><button onclick="deleteLast()">⌫</button></td>
                <td><button class="operator" onclick="chooseOperator('%')">%</button></td>
                <td><button class="operator" onclick="chooseOperator('/')">÷</button></td>
            </tr>

            <tr>
                <td><button onclick="addNumber('7')">7</button></td>
                <td><button onclick="addNumber('8')">8</button></td>
                <td><button onclick="addNumber('9')">9</button></td>
                <td><button class="operator" onclick="chooseOperator('*')">×</button></td>
            </tr>

            <tr>
                <td><button onclick="addNumber('4')">4</button></td>
                <td><button onclick="addNumber('5')">5</button></td>
                <td><button onclick="addNumber('6')">6</button></td>
                <td><button class="operator" onclick="chooseOperator('-')">−</button></td>
            </tr>

            <tr>
                <td><button onclick="addNumber('1')">1</button></td>
                <td><button onclick="addNumber('2')">2</button></td>
                <td><button onclick="addNumber('3')">3</button></td>
                <td><button class="operator" onclick="chooseOperator('+')">+</button></td>
            </tr>

            <tr>
                <td colspan="2">
                    <button onclick="addNumber('0')">0</button>
                </td>
                <td><button onclick="addDecimal()">.</button></td>
                <td><button class="equal" onclick="calculate()">=</button></td>
            </tr>
        </table>
    </main>

    <script>
        const display = document.getElementById("display");

        let firstNumber = null;
        let operator = null;
        let startNewNumber = true;

        function addNumber(number) {
            if (startNewNumber || display.value === "0") {
                display.value = number;
                startNewNumber = false;
            } else {
                display.value += number;
            }
        }

        function addDecimal() {
            if (startNewNumber) {
                display.value = "0.";
                startNewNumber = false;
            } else if (!display.value.includes(".")) {
                display.value += ".";
            }
        }

        function chooseOperator(selectedOperator) {
            firstNumber = Number(display.value);
            operator = selectedOperator;
            startNewNumber = true;
        }

        function calculate() {
            if (operator === null || firstNumber === null) {
                return;
            }

            const secondNumber = Number(display.value);
            let result;

            if (operator === "+") {
                result = firstNumber + secondNumber;
            } else if (operator === "-") {
                result = firstNumber - secondNumber;
            } else if (operator === "*") {
                result = firstNumber * secondNumber;
            } else if (operator === "/") {
                if (secondNumber === 0) {
                    display.value = "Cannot divide by zero";
                    firstNumber = null;
                    operator = null;
                    startNewNumber = true;
                    return;
                }
                result = firstNumber / secondNumber;
            } else if (operator === "%") {
                result = firstNumber % secondNumber;
            }

            display.value = String(Number(result.toPrecision(10)));
            firstNumber = null;
            operator = null;
            startNewNumber = true;
        }

        function clearDisplay() {
            display.value = "0";
            firstNumber = null;
            operator = null;
            startNewNumber = true;
        }

        function deleteLast() {
            if (startNewNumber) {
                return;
            }

            display.value = display.value.slice(0, -1);

            if (display.value === "" || display.value === "-") {
                display.value = "0";
                startNewNumber = true;
            }
        }
    </script>

</body>
</html>
